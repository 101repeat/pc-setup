<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Active Window</title>
    <link rel="stylesheet" href="../static/css/sdpi.css">
    <script src="../static/action.js"></script>
    <style>
        .sdpi-item-value[type=number] {
            width: 70px;
        }
    </style>
</head>

<body>
    <div class="sdpi-wrapper" style="display: none">
        <div class="sdpi-heading" id="heading">Active Window</div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelMode">Display mode</div>
            <select class="sdpi-item-value" id="displayMode" onchange="saveData()">
                <option value="0" id="optCard">Card</option>
                <option value="1" id="optIcon">Big icon</option>
            </select>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelWindow">Show window title</div>
            <input class="sdpi-item-value" type="checkbox" id="showWindowTitle" onchange="saveData()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelImage">Show picture</div>
            <input class="sdpi-item-value" type="checkbox" id="showImage" onchange="saveData()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelInterval">Update interval, ms</div>
            <input class="sdpi-item-value" type="number" id="interval" min="200" max="5000" step="100" value="500" oninput="saveData()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelHint">Hint</div>
            <div class="sdpi-item-value" id="hint">Shows the active window and the app whose volume is being changed</div>
        </div>
    </div>
    <script src="focusInfo.js"></script>
</body>

</html>
