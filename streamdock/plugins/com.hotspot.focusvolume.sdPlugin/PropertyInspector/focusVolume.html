<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Focus Volume</title>
    <link rel="stylesheet" href="../static/css/sdpi.css">
    <script src="../static/action.js"></script>
    <style>
        .sdpi-item-value[type=number] {
            width: 70px;
        }
    </style>
</head>

<body>
    <div class="sdpi-wrapper" style="display: none">
        <div class="sdpi-heading" id="heading">Focus Volume</div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelStep">Volume step, %</div>
            <input class="sdpi-item-value" type="number" id="step" min="1" max="50" step="1" value="5" oninput="saveData()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelMute">Mute on press</div>
            <input class="sdpi-item-value" type="checkbox" id="muteOnPress" onchange="saveData()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelFallback">Fallback to system volume</div>
            <input class="sdpi-item-value" type="checkbox" id="fallbackToSystem" onchange="saveData()">
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label" id="labelHint">Hint</div>
            <div class="sdpi-item-value" id="hint">Rotate the knob to set the volume of the app in focus</div>
        </div>
    </div>
    <script src="focusVolume.js"></script>
</body>

</html>
